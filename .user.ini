; PHP settings for Tahsin International (read by PHP-FPM / CGI, e.g. cPanel).
; Raises upload limits so the admin media library accepts larger images/PDFs.
; Note: takes effect within a few minutes (user_ini.cache_ttl). On cPanel you can
; also set these via MultiPHP INI Editor. Cannot exceed host-imposed hard caps.
upload_max_filesize = 16M
post_max_size = 20M
max_file_uploads = 20
memory_limit = 128M
max_execution_time = 120
